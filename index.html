<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Famous Zone | Trendy Fashion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7f1;
      color: #222;
    }
    header {
      background: #171717;
      color: white;
      text-align: center;
      padding: 20px 12px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }
    .hero {
      padding: 35px 16px;
      text-align: center;
      background: #eee2d2;
    }
    .hero h2 { font-size: 28px; margin: 0 0 10px; }
    .hero p { line-height: 1.5; }
    .section-title { text-align: center; margin: 28px 0 18px; }
    #products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 12px;
      max-width: 1000px;
      margin: auto;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 10px #00000012;
      padding-bottom: 14px;
    }
    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #eee;
    }
    .product h3 { font-size: 16px; margin: 12px 10px 6px; }
    .price { font-weight: bold; margin: 0 10px 12px; }
    .order {
      display: block;
      text-decoration: none;
      text-align: center;
      background: #1877f2;
      color: white;
      padding: 11px 8px;
      border-radius: 7px;
      margin: 0 10px;
      font-size: 14px;
      font-weight: bold;
    }
    .message {
      text-align: center;
      padding: 25px 15px;
      color: #555;
    }
    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 22px 12px;
      margin-top: 30px;
    }
    @media (min-width: 650px) {
      #products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .product img { height: 240px; }
    }
  </style>
</head>
<body>

<header>
  <h1>♛ Famous Zone</h1>
  <p>TRENDY FASHION. BEAUTIFUL YOU.</p>
</header>

<section class="hero">
  <h2>Discover Your Style</h2>
  <p>Beautiful Sarees, Three Piece Sets, Dresses & More.</p>
  <a class="order"
     style="display:inline-block;margin:10px auto;"
     href="https://www.facebook.com/messages/t/105522268102065"
     target="_blank" rel="noopener">
    Order on Messenger
  </a>
</section>

<h2 class="section-title">Our Collection</h2>

<div id="products">
  <p class="message">Loading products...</p>
</div>

<footer>
  <h3>Famous Zone</h3>
  <p>Fashion that feels like you.</p>
  <p>Order support available through Facebook Messenger.</p>
</footer>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxQ_HUxjEphialKvXm9P2r05pIb87FNy4",
    authDomain: "famous-zone.firebaseapp.com",
    databaseURL: "https://famous-zone-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "famous-zone",
    storageBucket: "famous-zone.firebasestorage.app",
    messagingSenderId: "642469736168",
    appId: "1:642469736168:web:0831ba7583c1f68b7ba35d"
  };

  const container = document.getElementById("products");
  const messengerURL =
    "https://www.facebook.com/messages/t/105522268102065";

  function showError(message) {
    container.innerHTML = "";
    const p = document.createElement("p");
    p.className = "message";
    p.textContent = message;
    container.appendChild(p);
  }

  function addText(parent, tag, value, className) {
    const el = document.createElement(tag);
    el.textContent = value ?? "";
    if (className) el.className = className;
    parent.appendChild(el);
    return el;
  }

  function renderProducts(data) {
    container.innerHTML = "";

    if (!data || Object.keys(data).length === 0) {
      showError("No products available yet. Please check back soon.");
      return;
    }

    Object.entries(data).forEach(([id, product]) => {
      if (!product || typeof product !== "object") return;

      const card = document.createElement("article");
      card.className = "product";

      if (product.photo) {
        const img = document.createElement("img");
        img.src = product.photo;
        img.alt = product.name || "Famous Zone product";
        img.loading = "lazy";
        img.onerror = () => {
          img.style.display = "none";
        };
        card.appendChild(img);
      }

      addText(card, "h3", product.name || "Fashion Item");
      addText(
        card,
        "p",
        product.price !== undefined && product.price !== ""
          ? "৳ " + product.price
          : "Price জানতে Messenger করুন",
        "price"
      );

      const order = document.createElement("a");
      order.className = "order";
      order.href = messengerURL;
      order.target = "_blank";
      order.rel = "noopener";
      order.textContent = "Order on Messenger";
      card.appendChild(order);

      container.appendChild(card);
    });

    if (!container.children.length) {
      showError("No valid products found. Check your product data.");
    }
  }

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(
      ref(db, "products"),
      (snapshot) => renderProducts(snapshot.val()),
      (error) => {
        console.error("Firebase read error:", error);
        showError(
          "Products could not load. Please check Firebase Database rules and connection."
        );
      }
    );
  } catch (error) {
    console.error(error);
    showError("Website setup error. Please check the Firebase configuration.");
  }
</script>

</body>
</html>
